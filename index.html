<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiziziTok</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}.snap{scroll-snap-type:y mandatory;height:100vh;overflow-y:scroll}.snap-item{scroll-snap-align:start;height:100vh;position:relative}video{width:100%;height:100%;object-fit:cover}</style></head><body>
<div style="position:fixed;top:0;left:0;right:0;z-index:50;padding:12px;background:linear-gradient(#000,transparent);display:flex;justify-content:space-between"><b style="font-size:20px">Mizizi<span style="color:#ff3b30">Tok</span></b><span style="font-size:10px;background:#ffffff22;padding:4px 8px;border-radius:20px">7 TRIBES LIVE</span></div>
<div style="position:fixed;top:50px;left:0;right:0;z-index:40;display:flex;gap:8px;overflow-x:auto;padding:8px 12px"><button onclick="filterTribe('All')" style="background:#ff3b30;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:bold">All</button><button onclick="filterTribe('Kisii')" style="background:#222;padding:6px 14px;border-radius:20px;font-size:13px">Kisii</button><button onclick="filterTribe('Luo')" style="background:#222;padding:6px 14px;border-radius:20px;font-size:13px">Luo</button><button onclick="filterTribe('Luhya')" style="background:#222;padding:6px 14px;border-radius:20px;font-size:13px">Luhya</button><button onclick="filterTribe('Kalenjin')" style="background:#222;padding:6px 14px;border-radius:20px;font-size:13px">Kalenjin</button><button onclick="filterTribe('Kamba')" style="background:#222;padding:6px 14px;border-radius:20px;font-size:13px">Kamba</button><button onclick="filterTribe('Kikuyu')" style="background:#222;padding:6px 14px;border-radius:20px;font-size:13px">Kikuyu</button><button onclick="filterTribe('Maasai')" style="background:#222;padding:6px 14px;border-radius:20px;font-size:13px">Maasai</button></div>
<div id="feed" class="snap"></div>
<button onclick="document.getElementById('up').style.display='flex'" style="position:fixed;bottom:20px;right:20px;background:#ff3b30;width:56px;height:56px;border-radius:50%;font-size:30px;z-index:60">+</button>
<div id="up" style="display:none;position:fixed;inset:0;background:#000000f0;z-index:70;flex-direction:column;padding:20px;justify-content:center"><h2 style="font-size:24px;font-weight:900">Post Your Culture</h2><input id="cap" placeholder="E.g. Obokano bwa Kisii 🔥" style="padding:14px;background:#1a1a1a;border-radius:10px;border:none;color:white;margin:12px 0"><select id="tr" style="padding:14px;background:#1a1a1a;border-radius:10px;border:none;color:white"><option>Kisii</option><option>Luo</option><option>Luhya</option><option>Kalenjin</option><option>Kamba</option><option>Kikuyu</option><option>Maasai</option></select><button onclick="postLocal()" style="background:#ff3b30;padding:14px;border-radius:10px;font-weight:bold;margin-top:12px">Post Now</button><button onclick="document.getElementById('up').style.display='none'" style="margin-top:10px;color:#666">Close</button></div>
<script>
const demos=[{tribe:'Kisii',cap:'Obokano dance - Kisii tradition 🔥 #KisiiCulture',likes:234,url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'},{tribe:'Luo',cap:'Ohangla moves! Dhol Luo to the world 🌍',likes:512,url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4'},{tribe:'Maasai',cap:'Adumu jumping dance - Maasai morans 💪',likes:892,url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'},{tribe:'Kikuyu',cap:'Mugithi night - Kikuyu vibes',likes:321,url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4'},{tribe:'Luhya',cap:'Isukuti drums - Luhya celebration',likes:445,url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4'},{tribe:'Kalenjin',cap:'Kalenjin warriors song',likes:678,url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4'},{tribe:'Kamba',cap:'Kamba traditional dance - Kilumi',likes:198,url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4'}];
let all=[...demos];let currentFilter='All';
function render(filter='All'){const feed=document.getElementById('feed');feed.innerHTML='';all.filter(v=>filter==='All'||v.tribe===filter).forEach(v=>{const d=document.createElement('div');d.className='snap-item';d.innerHTML=`<video src="${v.url}" loop muted playsinline autoplay onclick="this.paused?this.play():this.pause()"></video><div style="position:absolute;bottom:0;left:0;right:0;padding:20px 16px 30px;background:linear-gradient(transparent, black)"><span style="background:${v.tribe==='Kisii'?'#ff3b30':'#ffffff22'};padding:3px 10px;border-radius:12px;font-size:11px;font-weight:bold">${v.tribe}</span><p style="margin-top:8px;font-weight:700;font-size:15px">${v.cap}</p><p style="font-size:12px;opacity:0.7;margin-top:6px">❤️ ${v.likes} • 💬 ${Math.floor(v.likes/3)} • ↗️ Share</p></div>`;feed.appendChild(d);});}
function filterTribe(t){currentFilter=t;render(t);}function postLocal(){const cap=document.getElementById('cap').value||'My culture video 🔥';const tr=document.getElementById('tr').value;all.unshift({tribe:tr,cap:cap,likes:0,url:demos[Math.floor(Math.random()*demos.length)].url});document.getElementById('up').style.display='none';render(currentFilter);alert('Posted!');}
render();
</script></body></html>
