<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MIZIZITOK - 7 Tribes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,Arial;height:100vh;overflow:hidden}
/* HEADER */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:#000;padding:8px 12px}
.row1{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;letter-spacing:-1px}.logo span{color:#00ff88}
.search{flex:1;margin:0 10px;background:#1a1a1a;border-radius:20px;padding:7px 12px;display:flex;align-items:center}
.search input{flex:1;background:transparent;border:0;color:#fff;outline:0;font-size:14px}
.tabs{display:flex;justify-content:center;gap:24px;margin-top:8px;border-bottom:1px solid #222;padding-bottom:8px}
.tab{font-weight:700;font-size:15px;color:#888;padding:4px 8px;border-bottom:2px solid transparent}
.tab.active{color:#fff;border-bottom-color:#fff}
.tribes{display:flex;gap:7px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.tribes::-webkit-scrollbar{display:none}
.tribe{padding:5px 12px;background:#222;border:1px solid #333;border-radius:16px;font-size:12px;font-weight:700;white-space:nowrap;color:#aaa}
.tribe.active{background:#fff;color:#000}
/* FEED */
.feed{height:100vh;padding-top:110px;overflow-y:scroll;scroll-snap-type:y mandatory;padding-bottom:70px}
.card{height:calc(100vh - 110px);scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card video{width:100%;height:100%;object-fit:cover}
/* OVERLAYS */
.center-play{position:absolute;width:70px;height:70px;background:rgba(0,0,0,.45);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;z-index:4}
.volume{position:absolute;top:14px;right:14px;z-index:5;width:40px;height:40px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.side{position:absolute;right:8px;bottom:20px;z-index:5;display:flex;flex-direction:column;gap:20px;align-items:center}
.side-btn{display:flex;flex-direction:column;align-items:center;gap:3px}
.icon{width:46px;height:46px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;backdrop-filter:blur(6px)}
.icon.liked{background:#ff2d55}
.count{font-size:12px;font-weight:700}
.info{position:absolute;bottom:0;left:0;right:60px;padding:0 12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.95));z-index:4}
.user{font-weight:800;font-size:15px}.caption{font-size:13px;margin-top:4px;line-height:1.3}
.song{font-size:12px;margin-top:8px;display:flex;align-items:center;gap:6px}
.song span{animation:spin 3s linear infinite}
/* BOTTOM NAV */
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:101;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:6px 0 10px}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#888;font-size:10px;font-weight:600}
.nav.active{color:#fff}.nav i{font-size:22px;font-style:normal}
.plus{width:42px;height:28px;background:#fff;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center}
.plus::before{content:'';position:absolute;left:-4px;top:0;width:100%;height:100%;background:#ff2d55;border-radius:8px;z-index:-1}
.plus::after{content:'';position:absolute;right:-4px;top:0;width:100%;height:100%;background:#00f2ea;border-radius:8px;z-index:-1}
.plus b{color:#000;font-size:20px}
/* COMMENT SHEET */
.sheet{position:fixed;bottom:-100%;left:0;right:0;height:65%;background:#121212;z-index:200;border-radius:20px 20px 0 0;transition:.3s;padding:14px;display:flex;flex-direction:column}
.sheet.open{bottom:70px}
.sheet-head{display:flex;justify-content:space-between;font-weight:800;padding-bottom:10px;border-bottom:1px solid #222}
.comments{flex:1;overflow-y:auto;padding-top:10px}
.cmt{margin-bottom:12px;display:flex;gap:8px}.cmt b{font-size:13px}.cmt p{font-size:12px;color:#ccc}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="row1">
    <div class="logo">MIZIZI<span>TOK</span></div>
    <div class="search">🔍 <input id="searchBox" placeholder="Search tribe, song, user..." oninput="searchNow()"></div>
    <div style="font-size:20px">⚙️</div>
  </div>
  <div class="tabs">
    <div class="tab" id="tabFollowing" onclick="switchTab('following')">Following</div>
    <div class="tab active" id="tabForYou" onclick="switchTab('foryou')">For You</div>
  </div>
  <div class="tribes" id="tribeBar"></div>
</div>

<div class="feed" id="feed"></div>

<div class="bottom">
  <div class="nav active" onclick="switchTab('foryou')"><i>🏠</i>Home</div>
  <div class="nav" onclick="openExplore()"><i>🔍</i>Explore</div>
  <div class="nav" onclick="alert('Upload: Coming Soon! Record your tribe culture')"><div class="plus"><b>+</b></div></div>
  <div class="nav" onclick="alert('Friends: 1.2K tribe friends online')"><i>👥</i>Friends</div>
  <div class="nav" onclick="openInbox()"><i>📩</i>Inbox</div>
</div>

<div class="sheet" id="commentSheet">
  <div class="sheet-head"><span id="cmtCount">126 comments</span><span onclick="closeComments()" style="padding:0 10px">✕</span></div>
  <div class="comments" id="commentList"></div>
  <div style="display:flex;gap:8px;padding-top:10px;border-top:1px solid #222"><input id="cmtInput" placeholder="Add comment..." style="flex:1;background:#222;border:0;border-radius:20px;padding:10px 14px;color:#fff"><button onclick="addComment()" style="background:#ff2d55;border:0;color:#fff;border-radius:20px;padding:0 18px;font-weight:800">Post</button></div>
</div>
